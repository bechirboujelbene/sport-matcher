name: Build Docker Images

on:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:

  java-build-test:
    name: Build & test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [userservice, locationservice, matchingservice, messagingservice]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test with Gradle
        run: ./gradlew :${{ matrix.service }}:build
        working-directory: ./server

  genai-python-test:
    name: Test GenAI Python service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r genai/requirements.txt
      - name: Run pytest
        run: PYTHONPATH=. pytest genai/tests

  client-test:
    name: Lint & build React client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name: Lint
        run: npm run lint
        working-directory: ./client

      # The bundle is environment-neutral: Auth0/API/demo settings are injected
      # at container startup via runtime-config.js, not baked in at build time.
      - name: Build
        run: npm run build
        working-directory: ./client

  infra-check:
    name: Validate Compose, Helm, Terraform & Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm lint
        run: helm lint helm/team-evil-jenkins

      - name: Helm template renders
        run: |
          helm template sport-matcher helm/team-evil-jenkins \
            --set internalAuth.token=ci-dummy-token \
            --set postgres.password=ci-dummy-password > /dev/null

      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose --env-file .env config -q
          docker compose -f docker-compose.demo.yml config -q
          docker compose -f ansible/docker-compose.yml --env-file .env config -q

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.1

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init & validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: Install Ansible
        run: pip install ansible-core

      - name: Ansible syntax check
        run: ansible-playbook --syntax-check ansible/playbook.yml -i ansible/inventory.ini

  publish-images:
    name: Build & publish ${{ matrix.service.name }}
    needs: [java-build-test, genai-python-test, client-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: client
            context: ./client
            dockerfile: ./client/Dockerfile
          - name: user-service
            context: ./server
            dockerfile: ./server/userservice/Dockerfile
          - name: location-service
            context: ./server
            dockerfile: ./server/locationservice/Dockerfile
          - name: matching-service
            context: ./server
            dockerfile: ./server/matchingservice/Dockerfile
          - name: messaging-service
            context: ./server
            dockerfile: ./server/messagingservice/Dockerfile
          - name: genai
            context: ./genai
            dockerfile: ./genai/Dockerfile
          - name: nginx-gateway
            context: ./nginx
            dockerfile: ./nginx/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # PRs only prove the image builds; pushes publish to GHCR.
      - name: Build (and push) image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
