{{- if .Values.genai.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-deployment
  labels:
    {{- include "team-evil-jenkins.labels" . | nindent 4 }}
    app.kubernetes.io/component: genai
spec:
  replicas: {{ .Values.genai.replicaCount }}
  selector:
    matchLabels:
      {{- include "team-evil-jenkins.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: genai
  template:
    metadata:
      labels:
        {{- include "team-evil-jenkins.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: genai
    spec:
      containers:
        - name: genai
          image: "{{ .Values.ghcr.registry }}/{{ .Values.ghcr.organization }}/{{ .Values.ghcr.project }}/{{ .Values.genai.image.repository }}:{{ .Values.genai.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          env:
            - name: MATCHING_BACKEND
              value: {{ .Values.genai.matchingBackend | quote }}
            - name: GENAI_TOP_K
              value: {{ .Values.genai.topK | quote }}
            - name: OPENWEBUI_TIMEOUT
              value: {{ .Values.genai.openWebui.timeout | quote }}
            {{- if eq .Values.genai.matchingBackend "openwebui" }}
            - name: OPENWEBUI_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.genai.openWebui.secretName }}
                  key: OPENWEBUI_URL
            - name: OPENWEBUI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.genai.openWebui.secretName }}
                  key: OPENWEBUI_API_KEY
            {{- end }}
          resources:
            {{- toYaml .Values.genai.resources | nindent 12 }}
{{- end }}
