{{- if .Values.postgres.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.secretName }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "postgres.username is required when postgres.createSecret=true" .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.password is required when postgres.createSecret=true" .Values.postgres.password | quote }}
{{- end }}
