# Global values can be defined here

# Namespace configuration
namespace:
  name: team-evil-jenkins 
  create: false 


imagePullPolicy: Always

# Secrets for pulling images from private registries like GHCR
imagePullSecrets:
  - name: ghcr-creds # This should match the name of the secret you create in Kubernetes

# GHCR image registry
# Images are published as <registry>/<organization>/<project>/<service>
ghcr:
  registry: ghcr.io
  organization: bechirboujelbene
  project: sportmatcher

client:
  replicaCount: 1
  image:
    repository: client
    tag: latest 
  service:
    type: ClusterIP 
    port: 80 
  auth0:
    domain: ""
    clientId: ""
    audience: ""
  apiUrl: ""
  wsUrl: ""
  demoMode: "false"
  podSecurityContext: {}
  securityContext: {}
  resources: {}

userService:
  replicaCount: 1
  image:
    repository: user-service
    tag: latest
  service:
    type: ClusterIP
    port: 8080 # Container port
  podSecurityContext: {}
  securityContext: {}
  resources: {}

locationService:
  replicaCount: 1
  image:
    repository: location-service
    tag: latest
  service:
    type: ClusterIP
    port: 8080 # Container port 
  podSecurityContext: {}
  securityContext: {}
  resources: {}

messagingService:
  replicaCount: 1
  image:
    repository: messaging-service
    tag: latest
  service:
    type: ClusterIP
    port: 8080 # Container port
  allowedOrigins: "http://localhost:3000"
  podSecurityContext: {}
  securityContext: {}
  resources: {}

matchingService:
  replicaCount: 1
  image:
    repository: matching-service
    tag: latest
  service:
    type: ClusterIP
    port: 8080 # Container port
  podSecurityContext: {}
  securityContext: {}
  resources: {}

serviceAccount:
  create: false
  annotations: {}

internalAuth:
  secretName: internal-service-auth
  createSecret: false
  token: ""

postgres:
  secretName: postgres-secret
  createSecret: false
  username: ""
  password: ""

# Configuration for the Nginx Gateway service
nginxGateway:
  replicaCount: 1
  image:
    repository: nginx-gateway
    tag: latest
  resources: {}

# Configuration for the GenAI service
genai:
  enabled: true
  replicaCount: 1
  image:
    repository: genai
    tag: latest
  service:
    type: ClusterIP
    port: 8000 # Service port
  matchingBackend: deterministic
  topK: 10
  openWebui:
    timeout: 30
    secretName: genai-secrets
  podSecurityContext: {}
  securityContext: {}
  resources: {}


# Ingress configuration
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts:
        - sport-matcher.example.com
      secretName: team-evil-jenkins-tls
    - hosts:
        - api.sport-matcher.example.com
      secretName: team-evil-jenkins-api-tls
  client:
    host: sport-matcher.example.com
    path: /
    pathType: Prefix
  api:
    host: api.sport-matcher.example.com
  
  grafana:
    enabled: false

  prometheus:
    enabled: false
 
