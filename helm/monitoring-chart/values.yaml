# values.yaml for monitoring-chart

fullnameOverride: "monitoring"

prometheus:
  image:
    repository: prom/prometheus
    tag: v2.52.0
  service:
    type: ClusterIP
    port: 9090
  config:
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'user-service'
        metrics_path: '/api/actuator/prometheus'
        static_configs:
          - targets: ['user-service:8080']
      - job_name: 'location-service'
        metrics_path: '/api/actuator/prometheus'
        static_configs:
          - targets: ['location-service:8080']
      - job_name: 'matching-service'
        metrics_path: '/api/actuator/prometheus'
        static_configs:
          - targets: ['matching-service:8080']
      - job_name: 'messaging-service'
        metrics_path: '/api/actuator/prometheus'
        static_configs:
          - targets: ['messaging-service:8080']
      - job_name: 'genai'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['genai:8000'] 
grafana:
  smtp:
    enabled: false
    host: ""
    user: ""
    from_address: ""
    from_name: "Grafana Alerts"
    existingSecret: "grafana-smtp-secret"
    secretKey: "GF_SMTP_PASSWORD"

  image:
    repository: grafana/grafana-oss
    tag: "11.1.0"
  service:
    type: ClusterIP
    port: 3000
  provisioning:
    notifiers:
      enabled: false
      config: []

    enabled: true
    datasource:
      name: Prometheus
      type: prometheus
      access: proxy
      url: http://monitoring-prometheus-service:9090
      isDefault: true
  dashboard:
    enabled: true
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 1Gi

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    grafana: "grafana.sport-matcher.example.com"
    prometheus: "prometheus.sport-matcher.example.com"
  tls:
    - secretName: monitoring-tls-secret
      hosts:
        - grafana.sport-matcher.example.com
        - prometheus.sport-matcher.example.com
