services:
  client:
    build:
      context: ./client
    environment:
      VITE_DEMO_MODE: "true"
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
